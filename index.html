    headerTop:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10},
    headerActions:{display:"flex",gap:6,alignItems:"center",justifyContent:"flex-end",flexWrap:"wrap"},
    title:{fontSize:21,fontWeight:700,color:"#E0BE72",letterSpacing:1},
    sub:{fontSize:14,color:"#CDBF92",marginTop:2},
    metaRow:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8},
    metaText:{fontSize:12,color:"#C4B98C"},
    privacyBtn:(a)=>({background:a?"#E0BE72":"transparent",color:a?"#0A0A10":"#C4B98C",border:"1px solid "+(a?"#E0BE72":"#4A3B26"),borderRadius:8,fontSize:13,fontWeight:700,padding:"5px 10px",cursor:"pointer",whiteSpace:"nowrap"}),
    monthRow:{display:"flex",gap:6,marginTop:12,overflowX:"auto",paddingBottom:4,scrollBehavior:"smooth"},
    mBtn:(a)=>({padding:"5px 12px",borderRadius:20,border:"1px solid",borderColor:a?"#E0BE72":"#4A3B26",background:a?"#1A1610":"transparent",color:a?"#E0BE72":"#C4B98C",fontSize:14,cursor:"pointer",whiteSpace:"nowrap"}),
    rankRow:(sel)=>({display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:sel?"#1A1610":"transparent",border:sel?"1px solid #E0BE72":"1px solid transparent",borderRadius:10,marginBottom:6,cursor:"pointer"}),
    rankNum:(n)=>({width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,background:n===1?"#E0BE72":n===2?"#A0A0A0":n===3?"#B87333":"#4A3B26",color:n<=3?"#0A0A10":"#C4B98C"}),
    card:{background:"#12100C",border:"1px solid #3A3020",borderRadius:12,padding:"14px",marginBottom:12},
    txnCard:(g)=>({background:g?"#120A14":"#12100C",border:"1px solid "+(g?"#3A2040":"#3A3020"),borderRadius:10,padding:"10px 12px",marginBottom:8}),
    badge:(c)=>({fontSize:12,padding:"2px 8px",borderRadius:10,background:c+"22",color:c,border:"1px solid "+c+"44",fontWeight:600,display:"inline-block"}),
    tabs:{display:"flex",gap:4,overflowX:"auto",padding:"10px 12px",background:"#0D0B08",borderBottom:"1px solid #1A1610",position:"sticky",top:0,zIndex:10},
    tabBtn:(a)=>({padding:"6px 12px",borderRadius:8,border:"none",cursor:"pointer",fontSize:14,background:a?"#E0BE72":"transparent",color:a?"#0A0A10":"#C4B98C",fontWeight:a?700:400,whiteSpace:"nowrap"}),
    dayHead:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",background:"#14120E",borderRadius:8,marginBottom:4,cursor:"pointer",border:"1px solid #3A3020"},
    statRow:{display:"flex",gap:8,marginBottom:12},
    statCard:{flex:1,background:"#14120E",border:"1px solid #3A3020",borderRadius:10,padding:"10px",textAlign:"center"},
    svc:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #1A1610",fontSize:15},
    guarBox:{background:"#150A18",border:"1px solid #6A3090",borderRadius:10,padding:"12px 14px",marginBottom:12},
    lbRow:{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:"#12100C",border:"1px solid #3A3020",borderRadius:10,marginBottom:6},
    lbMedal:(n)=>({width:28,height:28,borderRadius:"50%",display:"flex",flexShrink:0,alignItems:"center",justifyContent:"center",fontSize:n<=3?18:15,fontWeight:700,background:n===1?"#E0BE72":n===2?"#A0A0A0":n===3?"#B87333":"#3A3020",color:n<=3?"#0A0A10":"#C4B98C"}),
  };

  const e=React.createElement;

  function TxnCard({r}){
    const customerLabel=display_customer(r.customer,privacyMode);
    if(r.guar)return e("div",{style:S.txnCard(true)},
      e("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
        e("span",{style:S.badge("#D79CFF")},"🛡 การันตี")),
      e("div",{style:{fontSize:15,color:"#E3C3F0"}},r.service),
      e("div",{style:{textAlign:"right",color:"#D79CFF",fontWeight:700,fontSize:16,marginTop:4}},"+"+fmt(r.payout))
    );
    return e("div",{style:S.txnCard(false)},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}},
        e("div",{style:{fontSize:15,color:"#F1E4C8",flex:1,marginRight:8}},r.service),
        e("div",{style:{color:"#E0BE72",fontWeight:700,fontSize:16,whiteSpace:"nowrap"}},fmt(r.payout))
      ),
      e("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
        customerLabel&&e("span",{style:{fontSize:13,color:"#D2BC9E"}},"👤 "+customerLabel),
        r.time&&e("span",{style:{fontSize:13,color:"#D2BC9E"}},"🕐 "+r.time+(r.dur?"–"+end_time(r.time,r.dur):"")),
        e("span",{style:{...S.badge(ch_color(r.channel)),fontSize:12}},r.channel),
        r.tip>0&&e("span",{style:S.badge("#F6C90E")},"🎁 tip +"+fmt(r.tip)),
        r.req>0&&e("span",{style:S.badge("#79D8B7")},"⭐ req +"+fmt(r.req))
      )
    );
  }

  function PeriodTab({p}){
    const rows=periodRows(p),total=periodTotal(p);
    const guarAmt=rows.reduce((s,d)=>s+dailyMap[d].filter(r=>r.guar).reduce((ss,r)=>ss+r.payout,0),0);
    return e("div",{style:{padding:"12px"}},
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"รายได้งาน"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},fmt(total-guarAmt))),
        guarAmt>0&&e("div",{style:{...S.statCard,borderColor:"#6A3090"}},e("div",{style:{fontSize:13,color:"#C790E5"}},"การันตีเพิ่ม"),e("div",{style:{fontSize:19,fontWeight:700,color:"#D79CFF"}},"+"+fmt(guarAmt))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"วันทำงาน"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},rows.length))
      ),
      rows.length===0&&e("div",{style:{textAlign:"center",color:"#9E9272",padding:40}},"ไม่มีข้อมูล"),
      ...rows.map(d=>{
        const recs=dailyMap[d],dayTotal=recs.reduce((s,r)=>s+r.payout,0),dayGuar=recs.filter(r=>r.guar).reduce((s,r)=>s+r.payout,0),open=expandDay[d];
        return e("div",{key:d,style:{marginBottom:8}},
          e("div",{style:S.dayHead,onClick:()=>setExpandDay(prev=>({...prev,[d]:!prev[d]}))},
            e("span",{style:{fontSize:15}},th_date(d)),
            e("div",{style:{display:"flex",alignItems:"center",gap:8}},
              dayGuar>0&&e("span",{style:{fontSize:14,color:"#D79CFF"}},"🛡+"+fmt(dayGuar)),
              e("span",{style:{color:"#E0BE72",fontWeight:700}},fmt(dayTotal)),
              e("span",{style:{fontSize:14,color:"#9E9272"}},open?"▲":"▼")
            )
          ),
          open&&e("div",{style:{paddingLeft:4}},...recs.map((r,i)=>e(TxnCard,{key:i,r})))
        );
      })
    );
  }

  const curMonth=MONTHS.find(m=>m.key===month);

  return e("div",{style:S.app},
    // HEADER
    e("div",{style:S.header},
      e("div",{style:S.headerTop},
        e("div",null,
          e("div",{style:S.title},"✦ JAI CHAN SPA"),
          e("div",{style:S.sub},"Siam Discovery · ระบบค่ามือ"),
          e("div",{style:S.metaRow},
            e("span",{style:S.badge(freshness.color)},freshness.label),
            e("span",{style:S.metaText},freshness.detail)
          ),
          appMetaDetail&&e("div",{style:S.metaRow},
            e("span",{style:S.metaText},appMetaDetail)
          )
        ),
        e("div",{style:S.headerActions},
          e("button",{type:"button","aria-pressed":privacyMode,disabled:PRIVACY_BUILD,title:PRIVACY_BUILD?"ไฟล์ publish นี้ลบชื่อจริงออกแล้ว":privacyMode?"ปิดโหมดซ่อนชื่อ":"เปิดโหมดซ่อนชื่อ",onClick:togglePrivacy,style:S.privacyBtn(privacyMode)},PRIVACY_BUILD?"🔒 ลบชื่อจริง":privacyMode?"🔒 ซ่อนชื่อ":"👁 แสดงชื่อ"),
          therapist&&e("button",{onClick:()=>{setTherapist(null);setTab("rank");},style:{background:"transparent",border:"1px solid #4A3B26",borderRadius:8,color:"#C4B98C",fontSize:13,padding:"4px 10px",cursor:"pointer"}},"← กลับ")
        )
      ),
      e("div",{style:S.monthRow,ref:monthRowRef},...MONTHS.map(m=>e("button",{key:m.key,style:S.mBtn(month===m.key),"data-active-month":month===m.key?"true":undefined,onClick:()=>{setMonth(m.key);setTherapist(null);setTab("rank");setExpandDay({});}},m.label))),
      therapist&&e("div",{style:{marginTop:10,display:"flex",alignItems:"center",gap:8}},
        e("div",{style:{width:36,height:36,borderRadius:"50%",background:"#1A1610",border:"1px solid #E0BE72",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19}},"👤"),
        e("div",null,e("div",{style:{fontWeight:700,color:"#E0BE72",fontSize:17}},therapist),e("div",{style:{fontSize:13,color:"#C4B98C"}},curMonth?.label))
      )
    ),
    // TABS
    !therapist&&e("div",{style:S.tabs},
      e("button",{style:S.tabBtn(tab==="rank"),onClick:()=>setTab("rank")},"🏆 อันดับ"),
      e("button",{style:S.tabBtn(tab==="leaderboard"),onClick:()=>setTab("leaderboard")},"🎖 Leaderboard")
    ),
    therapist&&e("div",{style:S.tabs},
      ...[{k:"yesterday",l:"รายการล่าสุด"},{k:"p1",l:"รอบ 1–15"},{k:"p2",l:"รอบ 16–31"},{k:"month",l:"ทั้งเดือน"},{k:"all",l:"ทุกรายการ"}].map(t=>e("button",{key:t.k,style:S.tabBtn(tab===t.k),onClick:()=>setTab(t.k)},t.l))
    ),

    // ── RANK TAB ──
    !therapist&&tab==="rank"&&e("div",{style:{padding:"14px 12px"}},
      e("div",{style:{fontSize:15,color:"#C4B98C",marginBottom:10}},"🏆 "+curMonth?.label+" — อันดับค่ามือ"),
      ...ranking.map(r=>e("div",{key:r.name,style:S.rankRow(therapist===r.name),onClick:()=>{setTherapist(r.name);setTab("month");}},
        e("div",{style:S.rankNum(r.rank)},r.rank),
        e("div",{style:{flex:1}},
          e("div",{style:{fontWeight:600,fontSize:15}},r.name),
          e("div",{style:{fontSize:13,color:"#C4B98C",marginTop:2}},r.days+" วัน · P1 "+fmt(r.p1)+" · P2 "+fmt(r.p2))
        ),
        e("div",{style:{textAlign:"right"}},
          e("div",{style:{fontWeight:700,color:"#E0BE72",fontSize:17}},fmt(r.total)),
          r.guar>0&&e("div",{style:{fontSize:13,color:"#D79CFF"}},"🛡 +"+fmt(r.guar))
        )
      ))
    ),

    // ── LEADERBOARD TAB ──
    !therapist&&tab==="leaderboard"&&e("div",{style:{padding:"14px 12px"}},
      e("div",{style:{display:"flex",gap:8,marginBottom:14}},
        e("button",{style:S.mBtn(lbScope==="month"),onClick:()=>setLbScope("month")},"📅 "+curMonth?.label),
        e("button",{style:S.mBtn(lbScope==="all"),onClick:()=>setLbScope("all")},"🌐 ทั้งหมด ("+ALL_MONTH_RANGE+")")
      ),
      e("div",{style:{display:"flex",gap:8,marginBottom:16}},
        e("button",{style:{...S.mBtn(lbMetric==="payout"),flex:1,textAlign:"center"},onClick:()=>setLbMetric("payout")},"💰 Top ค่ามือ"),
        e("button",{style:{...S.mBtn(lbMetric==="customers"),flex:1,textAlign:"center"},onClick:()=>setLbMetric("customers")},"👥 Top จำนวนลูกค้า")
      ),
      lbMetric==="payout"&&e("div",null,
        e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:10}},"💰 อันดับรายได้ค่ามือรวม"+(lbScope==="all"?" · "+ALL_MONTH_RANGE:"")),
        ...leaderboard.byPayout.map(r=>e("div",{key:r.name,style:S.lbRow},
          e("div",{style:S.lbMedal(r.payoutRank)},r.payoutRank===1?"🥇":r.payoutRank===2?"🥈":r.payoutRank===3?"🥉":r.payoutRank),
          e("div",{style:{flex:1}},
            e("div",{style:{fontWeight:600,fontSize:15}},r.name),
            e("div",{style:{fontSize:13,color:"#C4B98C",marginTop:2}},r.sessions+" งาน · "+r.custCount+" ลูกค้า")
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontWeight:700,color:"#E0BE72",fontSize:17}},fmt(r.totalPayout)),
            e("div",{style:{fontSize:13,color:"#C4B98C"}},"฿"+Math.round(r.totalPayout/r.sessions).toLocaleString()+"/งาน")
          )
        ))
      ),
      lbMetric==="customers"&&e("div",null,
        e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:10}},"👥 อันดับลูกค้า (unique)"+(lbScope==="all"?" · "+ALL_MONTH_RANGE:"")),
        ...leaderboard.byCustomer.map(r=>e("div",{key:r.name,style:S.lbRow},
          e("div",{style:S.lbMedal(r.custRank)},r.custRank===1?"🥇":r.custRank===2?"🥈":r.custRank===3?"🥉":r.custRank),
          e("div",{style:{flex:1}},
            e("div",{style:{fontWeight:600,fontSize:15}},r.name),
            e("div",{style:{fontSize:13,color:"#C4B98C",marginTop:2}},r.sessions+" งาน · "+fmt(r.totalPayout))
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontWeight:700,color:"#E0BE72",fontSize:23}},r.custCount),
            e("div",{style:{fontSize:13,color:"#C4B98C"}},"คน")
          )
        ))
      )
    ),

    // ── YESTERDAY TAB ──
    therapist&&tab==="yesterday"&&e("div",{style:{padding:"12px"}},
      lastDay?e("div",null,
        e("div",{style:{fontSize:15,color:"#C4B98C",marginBottom:10}},"📅 "+th_date(lastDay)+" — รายการล่าสุด"),
        e("div",{style:S.statRow},
          e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"รวมล่าสุด"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},fmt(lastDayRecs.reduce((s,r)=>s+r.payout,0)))),
          e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"จำนวน"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},lastDayRecs.length+" งาน"))
        ),
        lastDayRecs.length===0?e("div",{style:{textAlign:"center",color:"#9E9272",padding:40}},"ไม่มีงาน"):lastDayRecs.map((r,i)=>e(TxnCard,{key:i,r}))
      ):e("div",{style:{textAlign:"center",color:"#9E9272",padding:40}},"ไม่มีข้อมูล")
    ),

    // ── P1 / P2 ──
    therapist&&tab==="p1"&&e(PeriodTab,{p:1}),
    therapist&&tab==="p2"&&e(PeriodTab,{p:2}),

    // ── MONTH TAB ──
    therapist&&tab==="month"&&e("div",{style:{padding:"12px"}},
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"รายได้จากงาน"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},fmt(myEarned))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"วันทำงาน"),e("div",{style:{fontSize:19,fontWeight:700,color:"#E0BE72"}},new Set(myData.filter(r=>!r.guar).map(r=>r.date)).size))
      ),
      myGuarTotal>0&&e("div",{style:S.guarBox},
        e("div",{style:{fontSize:14,color:"#C790E5",marginBottom:6}},"🛡 การันตีค่ามือขั้นต่ำ "+fmt(GUARANTEE[therapist])+"/วัน"),
        e("div",{style:{display:"flex",justifyContent:"space-between"}},
          e("div",null,e("div",{style:{fontSize:13,color:"#C4B98C"}},"จากงานจริง"),e("div",{style:{fontWeight:700,color:"#E0BE72"}},fmt(myEarned))),
          e("div",null,e("div",{style:{fontSize:13,color:"#C4B98C"}},"การันตีเพิ่ม"),e("div",{style:{fontWeight:700,color:"#D79CFF"}},"+"+fmt(myGuarTotal))),
          e("div",null,e("div",{style:{fontSize:13,color:"#C4B98C"}},"รวมทั้งหมด"),e("div",{style:{fontWeight:700,color:"#E0BE72"}},fmt(myTotal)))
        )
      ),
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"รอบ 1–15"),e("div",{style:{fontSize:16,fontWeight:700,color:"#E0BE72"}},fmt(periodTotal(1)))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:13,color:"#C4B98C"}},"รอบ 16–31"),e("div",{style:{fontSize:16,fontWeight:700,color:"#E0BE72"}},fmt(periodTotal(2))))
      ),
      projection&&e("div",{style:{...S.card,textAlign:"center",marginBottom:12}},
        e("div",{style:{fontSize:13,color:"#C4B98C",marginBottom:4}},"📈 ประมาณการทั้งเดือน"),
        e("div",{style:{fontSize:23,fontWeight:700,color:"#E0BE72"}},fmt(projection))
      ),
      topServices.length>0&&e("div",{style:{...S.card,marginBottom:12}},
        e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:8}},"🏅 บริการยอดนิยม"),
        ...topServices.map(([svc,amt],i)=>e("div",{key:i,style:S.svc},e("span",{style:{color:"#EADDBF",fontSize:14,flex:1,marginRight:8}},svc),e("span",{style:{color:"#E0BE72",fontWeight:600}},fmt(amt))))
      ),
      chBreakdown.length>0&&e("div",{style:S.card},
        e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:8}},"📊 ช่องทาง"),
        ...chBreakdown.map(([ch,amt])=>e("div",{key:ch,style:S.svc},e("span",{style:{...S.badge(ch_color(ch)),fontSize:13}},ch),e("span",{style:{color:"#E0BE72",fontWeight:600}},fmt(amt))))
      )
    ),

    // ── ALL TXN TAB ──
    therapist&&tab==="all"&&e("div",{style:{padding:"12px"}},
      e("div",{style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}},
        e("button",{style:S.mBtn(chFilter==="all"),onClick:()=>setChFilter("all")},"ทั้งหมด"),
        ...allChannels.map(ch=>e("button",{key:ch,style:S.mBtn(chFilter===ch),onClick:()=>setChFilter(ch)},ch))
      ),
      guarInfo&&e("div",{style:{marginBottom:12}},e("button",{style:S.mBtn(showGuar),onClick:()=>setShowGuar(!showGuar)},"🛡 การันตี")),
      e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:8}},allTxn.length+" รายการ · รวม "+fmt(allTxn.reduce((s,r)=>s+r.payout,0))),
      ...allTxn.map((r,i)=>e("div",{key:i},
        (i===0||allTxn[i-1].date!==r.date)&&e("div",{style:{fontSize:14,color:"#C4B98C",marginBottom:4,marginTop:i>0?12:0}},th_date(r.date)),
        e(TxnCard,{r})
      )),
      allTxn.length===0&&e("div",{style:{textAlign:"center",color:"#9E9272",padding:40}},"ไม่มีรายการ")
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
