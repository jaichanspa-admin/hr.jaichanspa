};

const th_date=(d)=>{
  const[y,mo,dd]=d.split("-");
  const days=["อา","จ","อ","พ","พฤ","ศ","ส"];
  const dow=days[new Date(d).getDay()];
  const months={"01":"ม.ค.","02":"ก.พ.","03":"มี.ค.","04":"เม.ย.","05":"พ.ค."};
  return dow+" "+parseInt(dd)+" "+months[mo];
};
const end_time=(time,dur)=>{
  if(!time||!dur)return"";
  const[h,m]=time.split(":").map(Number);
  const total=h*60+m+Number(dur);
  return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
};
const period_of=(d)=>parseInt(d.slice(8,10))<=15?1:2;

function App(){

  const myData=useMemo(()=>therapist?monthData.filter(r=>r.therapist===therapist):[],[monthData,therapist]);

  const ranking=useMemo(()=>{
    const map={};
    monthData.forEach(r=>{
      if(!map[r.therapist])map[r.therapist]={name:r.therapist,total:0,p1:0,p2:0,guar:0,days:new Set()};
      if(!r.guar){
        const p=period_of(r.date);
        map[r.therapist].total+=r.payout;
        if(p===1)map[r.therapist].p1+=r.payout;
        else map[r.therapist].p2+=r.payout;
        map[r.therapist].days.add(r.date);
      }else{map[r.therapist].guar+=r.payout;map[r.therapist].total+=r.payout;}
    });
    return Object.values(map).sort((a,b)=>b.total-a.total).map((x,i)=>({...x,rank:i+1,days:x.days.size}));
  },[monthData]);

  const leaderboard=useMemo(()=>{
    const source=lbScope==="month"?monthData:RAW;
    const map={};
    source.forEach(r=>{
      if(r.guar)return;
      if(!map[r.therapist])map[r.therapist]={name:r.therapist,totalPayout:0,customers:new Set(),sessions:0};
      map[r.therapist].totalPayout+=r.payout;
      if(r.customer&&r.customer!=="-")map[r.therapist].customers.add(r.customer);
      map[r.therapist].sessions++;
    });
    const arr=Object.values(map).map(x=>({...x,custCount:x.customers.size}));
    const byPayout=[...arr].sort((a,b)=>b.totalPayout-a.totalPayout).map((x,i)=>({...x,payoutRank:i+1}));
    const byCustomer=[...arr].sort((a,b)=>b.custCount-a.custCount).map((x,i)=>({...x,custRank:i+1}));
    return{byPayout,byCustomer};
  },[monthData,lbScope]);

  },[myData]);

  const periodRows=(p)=>Object.keys(dailyMap).filter(d=>period_of(d)===p).sort();
  const periodTotal=(p)=>{let s=0;periodRows(p).forEach(d=>dailyMap[d].forEach(r=>s+=r.payout));return s;};
  const myTotal=useMemo(()=>myData.reduce((s,r)=>s+r.payout,0),[myData]);

  const projection=useMemo(()=>{
    const worked=new Set(myData.map(r=>r.date)).size;
    const dim=month==="2026-02"?28:month==="2026-04"?30:31;
    if(!worked)return null;
    return Math.round((myTotal/worked)*dim);
  },[myData,myTotal,month]);

  const S={
    app:{background:"#0A0A10",minHeight:"100vh",maxWidth:480,margin:"0 auto",fontFamily:"'Sarabun',sans-serif",color:"#E8E0D0",paddingBottom:80},
    header:{background:"linear-gradient(135deg,#1A1610,#0F0C08)",borderBottom:"1px solid #2A2318",padding:"16px 16px 12px"},
    title:{fontSize:20,fontWeight:700,color:"#C8A35A",letterSpacing:1},
    sub:{fontSize:12,color:"#8A7A5A",marginTop:2},
    monthRow:{display:"flex",gap:6,marginTop:12,overflowX:"auto",paddingBottom:4},
    mBtn:(a)=>({padding:"5px 12px",borderRadius:20,border:"1px solid",borderColor:a?"#C8A35A":"#2A2318",background:a?"#1A1610":"transparent",color:a?"#C8A35A":"#665A40",fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}),
    rankRow:(sel)=>({display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:sel?"#1A1610":"transparent",border:sel?"1px solid #C8A35A":"1px solid transparent",borderRadius:10,marginBottom:6,cursor:"pointer"}),
    rankNum:(n)=>({width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,background:n===1?"#C8A35A":n===2?"#A0A0A0":n===3?"#B87333":"#2A2318",color:n<=3?"#0A0A10":"#665A40"}),
    card:{background:"#12100C",border:"1px solid #1E1A12",borderRadius:12,padding:"14px",marginBottom:12},
    txnCard:(g)=>({background:g?"#120A14":"#12100C",border:"1px solid "+(g?"#3A2040":"#1E1A12"),borderRadius:10,padding:"10px 12px",marginBottom:8}),
    badge:(c)=>({fontSize:10,padding:"2px 8px",borderRadius:10,background:c+"22",color:c,border:"1px solid "+c+"44",fontWeight:600,display:"inline-block"}),
    tabs:{display:"flex",gap:4,overflowX:"auto",padding:"10px 12px",background:"#0D0B08",borderBottom:"1px solid #1A1610",position:"sticky",top:0,zIndex:10},
    tabBtn:(a)=>({padding:"6px 12px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,background:a?"#C8A35A":"transparent",color:a?"#0A0A10":"#665A40",fontWeight:a?700:400,whiteSpace:"nowrap"}),
    dayHead:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",background:"#14120E",borderRadius:8,marginBottom:4,cursor:"pointer",border:"1px solid #1E1A12"},
    statRow:{display:"flex",gap:8,marginBottom:12},
    statCard:{flex:1,background:"#14120E",border:"1px solid #1E1A12",borderRadius:10,padding:"10px",textAlign:"center"},
    svc:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #1A1610",fontSize:13},
    guarBox:{background:"#150A18",border:"1px solid #6A3090",borderRadius:10,padding:"12px 14px",marginBottom:12},
    lbRow:{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:"#12100C",border:"1px solid #1E1A12",borderRadius:10,marginBottom:6},
    lbMedal:(n)=>({width:28,height:28,borderRadius:"50%",display:"flex",flexShrink:0,alignItems:"center",justifyContent:"center",fontSize:n<=3?16:13,fontWeight:700,background:n===1?"#C8A35A":n===2?"#A0A0A0":n===3?"#B87333":"#1E1A12",color:n<=3?"#0A0A10":"#665A40"}),
  };

  const e=React.createElement;

  function TxnCard({r}){
    if(r.guar)return e("div",{style:S.txnCard(true)},
      e("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
        e("span",{style:S.badge("#BF77F6")},"🛡 การันตี")),
      e("div",{style:{fontSize:13,color:"#C0A0D0"}},r.service),
      e("div",{style:{textAlign:"right",color:"#BF77F6",fontWeight:700,fontSize:15,marginTop:4}},"+"+fmt(r.payout))
    );
    return e("div",{style:S.txnCard(false)},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}},
        e("div",{style:{fontSize:13,color:"#D8C8A8",flex:1,marginRight:8}},r.service),
        e("div",{style:{color:"#C8A35A",fontWeight:700,fontSize:15,whiteSpace:"nowrap"}},fmt(r.payout))
      ),
      e("div",{style:{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
        r.customer&&e("span",{style:{fontSize:11,color:"#887060"}},"👤 "+r.customer),
        r.time&&e("span",{style:{fontSize:11,color:"#887060"}},"🕐 "+r.time+(r.dur?"–"+end_time(r.time,r.dur):"")),
        e("span",{style:{...S.badge(ch_color(r.channel)),fontSize:10}},r.channel),
        r.tip>0&&e("span",{style:S.badge("#F6C90E")},"🎁 tip +"+fmt(r.tip)),
        r.req>0&&e("span",{style:S.badge("#60C0A0")},"⭐ req +"+fmt(r.req))
      )
    );
  }

  function PeriodTab({p}){
    const rows=periodRows(p),total=periodTotal(p);
    const guarAmt=rows.reduce((s,d)=>s+dailyMap[d].filter(r=>r.guar).reduce((ss,r)=>ss+r.payout,0),0);
    return e("div",{style:{padding:"12px"}},
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"รายได้งาน"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},fmt(total-guarAmt))),
        guarAmt>0&&e("div",{style:{...S.statCard,borderColor:"#6A3090"}},e("div",{style:{fontSize:11,color:"#9060B0"}},"การันตีเพิ่ม"),e("div",{style:{fontSize:18,fontWeight:700,color:"#BF77F6"}},"+"+fmt(guarAmt))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"วันทำงาน"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},rows.length))
      ),
      rows.length===0&&e("div",{style:{textAlign:"center",color:"#443A28",padding:40}},"ไม่มีข้อมูล"),
      ...rows.map(d=>{
        const recs=dailyMap[d],dayTotal=recs.reduce((s,r)=>s+r.payout,0),dayGuar=recs.filter(r=>r.guar).reduce((s,r)=>s+r.payout,0),open=expandDay[d];
        return e("div",{key:d,style:{marginBottom:8}},
          e("div",{style:S.dayHead,onClick:()=>setExpandDay(prev=>({...prev,[d]:!prev[d]}))},
            e("span",{style:{fontSize:13}},th_date(d)),
            e("div",{style:{display:"flex",alignItems:"center",gap:8}},
              dayGuar>0&&e("span",{style:{fontSize:12,color:"#BF77F6"}},"🛡+"+fmt(dayGuar)),
              e("span",{style:{color:"#C8A35A",fontWeight:700}},fmt(dayTotal)),
              e("span",{style:{fontSize:12,color:"#443A28"}},open?"▲":"▼")
            )
          ),
          open&&e("div",{style:{paddingLeft:4}},...recs.map((r,i)=>e(TxnCard,{key:i,r})))
        );
      })
    );
  }

  const curMonth=MONTHS.find(m=>m.key===month);

  return e("div",{style:S.app},
    // HEADER
    e("div",{style:S.header},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
        e("div",null,e("div",{style:S.title},"✦ JAI CHAN SPA"),e("div",{style:S.sub},"Siam Discovery · ระบบค่ามือ")),
        therapist&&e("button",{onClick:()=>{setTherapist(null);setTab("rank");},style:{background:"transparent",border:"1px solid #2A2318",borderRadius:8,color:"#665A40",fontSize:11,padding:"4px 10px",cursor:"pointer"}},"← กลับ")
      ),
      e("div",{style:S.monthRow},...MONTHS.map(m=>e("button",{key:m.key,style:S.mBtn(month===m.key),onClick:()=>{setMonth(m.key);setTherapist(null);setTab("rank");setExpandDay({});}},m.label))),
      therapist&&e("div",{style:{marginTop:10,display:"flex",alignItems:"center",gap:8}},
        e("div",{style:{width:36,height:36,borderRadius:"50%",background:"#1A1610",border:"1px solid #C8A35A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},"👤"),
        e("div",null,e("div",{style:{fontWeight:700,color:"#C8A35A",fontSize:16}},therapist),e("div",{style:{fontSize:11,color:"#665A40"}},curMonth?.label))
      )
    ),
    // TABS
    !therapist&&e("div",{style:S.tabs},
      e("button",{style:S.tabBtn(tab==="rank"),onClick:()=>setTab("rank")},"🏆 อันดับ"),
      e("button",{style:S.tabBtn(tab==="leaderboard"),onClick:()=>setTab("leaderboard")},"🎖 Leaderboard")
    ),
    therapist&&e("div",{style:S.tabs},
      ...[{k:"yesterday",l:"เมื่อวาน"},{k:"p1",l:"รอบ 1–15"},{k:"p2",l:"รอบ 16–31"},{k:"month",l:"ทั้งเดือน"},{k:"all",l:"ทุกรายการ"}].map(t=>e("button",{key:t.k,style:S.tabBtn(tab===t.k),onClick:()=>setTab(t.k)},t.l))
    ),

    // ── RANK TAB ──
    !therapist&&tab==="rank"&&e("div",{style:{padding:"14px 12px"}},
      e("div",{style:{fontSize:13,color:"#665A40",marginBottom:10}},"🏆 "+curMonth?.label+" — อันดับค่ามือ"),
      ...ranking.map(r=>e("div",{key:r.name,style:S.rankRow(therapist===r.name),onClick:()=>{setTherapist(r.name);setTab("month");}},
        e("div",{style:S.rankNum(r.rank)},r.rank),
        e("div",{style:{flex:1}},
          e("div",{style:{fontWeight:600,fontSize:14}},r.name),
          e("div",{style:{fontSize:11,color:"#665A40",marginTop:2}},r.days+" วัน · P1 "+fmt(r.p1)+" · P2 "+fmt(r.p2))
        ),
        e("div",{style:{textAlign:"right"}},
          e("div",{style:{fontWeight:700,color:"#C8A35A",fontSize:16}},fmt(r.total)),
          r.guar>0&&e("div",{style:{fontSize:11,color:"#BF77F6"}},"🛡 +"+fmt(r.guar))
        )
      ))
    ),

    // ── LEADERBOARD TAB ──
    !therapist&&tab==="leaderboard"&&e("div",{style:{padding:"14px 12px"}},
      e("div",{style:{display:"flex",gap:8,marginBottom:14}},
        e("button",{style:S.mBtn(lbScope==="month"),onClick:()=>setLbScope("month")},"📅 "+curMonth?.label),
        e("button",{style:S.mBtn(lbScope==="all"),onClick:()=>setLbScope("all")},"🌐 ทั้งหมด (ม.ค.–เม.ย.)")
      ),
      e("div",{style:{display:"flex",gap:8,marginBottom:16}},
        e("button",{style:{...S.mBtn(lbMetric==="payout"),flex:1,textAlign:"center"},onClick:()=>setLbMetric("payout")},"💰 Top ค่ามือ"),
        e("button",{style:{...S.mBtn(lbMetric==="customers"),flex:1,textAlign:"center"},onClick:()=>setLbMetric("customers")},"👥 Top จำนวนลูกค้า")
      ),
      lbMetric==="payout"&&e("div",null,
        e("div",{style:{fontSize:12,color:"#665A40",marginBottom:10}},"💰 อันดับรายได้ค่ามือรวม"+(lbScope==="all"?" · ม.ค.–เม.ย. 2569":"")),
        ...leaderboard.byPayout.map(r=>e("div",{key:r.name,style:S.lbRow},
          e("div",{style:S.lbMedal(r.payoutRank)},r.payoutRank===1?"🥇":r.payoutRank===2?"🥈":r.payoutRank===3?"🥉":r.payoutRank),
          e("div",{style:{flex:1}},
            e("div",{style:{fontWeight:600,fontSize:14}},r.name),
            e("div",{style:{fontSize:11,color:"#665A40",marginTop:2}},r.sessions+" งาน · "+r.custCount+" ลูกค้า")
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontWeight:700,color:"#C8A35A",fontSize:16}},fmt(r.totalPayout)),
            e("div",{style:{fontSize:11,color:"#665A40"}},"฿"+Math.round(r.totalPayout/r.sessions).toLocaleString()+"/งาน")
          )
        ))
      ),
      lbMetric==="customers"&&e("div",null,
        e("div",{style:{fontSize:12,color:"#665A40",marginBottom:10}},"👥 อันดับลูกค้า (unique)"+(lbScope==="all"?" · ม.ค.–เม.ย. 2569":"")),
        ...leaderboard.byCustomer.map(r=>e("div",{key:r.name,style:S.lbRow},
          e("div",{style:S.lbMedal(r.custRank)},r.custRank===1?"🥇":r.custRank===2?"🥈":r.custRank===3?"🥉":r.custRank),
          e("div",{style:{flex:1}},
            e("div",{style:{fontWeight:600,fontSize:14}},r.name),
            e("div",{style:{fontSize:11,color:"#665A40",marginTop:2}},r.sessions+" งาน · "+fmt(r.totalPayout))
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontWeight:700,color:"#C8A35A",fontSize:22}},r.custCount),
            e("div",{style:{fontSize:11,color:"#665A40"}},"คน")
          )
        ))
      )
    ),

    // ── YESTERDAY TAB ──
    therapist&&tab==="yesterday"&&e("div",{style:{padding:"12px"}},
      lastDay?e("div",null,
        e("div",{style:{fontSize:13,color:"#665A40",marginBottom:10}},"📅 "+th_date(lastDay)+" — รายการล่าสุด"),
        e("div",{style:S.statRow},
          e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"รวมวันนี้"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},fmt(lastDayRecs.reduce((s,r)=>s+r.payout,0)))),
          e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"จำนวน"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},lastDayRecs.length+" งาน"))
        ),
        lastDayRecs.length===0?e("div",{style:{textAlign:"center",color:"#443A28",padding:40}},"ไม่มีงาน"):lastDayRecs.map((r,i)=>e(TxnCard,{key:i,r}))
      ):e("div",{style:{textAlign:"center",color:"#443A28",padding:40}},"ไม่มีข้อมูล")
    ),

    // ── P1 / P2 ──
    therapist&&tab==="p1"&&e(PeriodTab,{p:1}),
    therapist&&tab==="p2"&&e(PeriodTab,{p:2}),

    // ── MONTH TAB ──
    therapist&&tab==="month"&&e("div",{style:{padding:"12px"}},
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"รายได้จากงาน"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},fmt(myEarned))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"วันทำงาน"),e("div",{style:{fontSize:18,fontWeight:700,color:"#C8A35A"}},new Set(myData.filter(r=>!r.guar).map(r=>r.date)).size))
      ),
      myGuarTotal>0&&e("div",{style:S.guarBox},
        e("div",{style:{fontSize:12,color:"#9060B0",marginBottom:6}},"🛡 การันตีค่ามือขั้นต่ำ "+fmt(GUARANTEE[therapist])+"/วัน"),
        e("div",{style:{display:"flex",justifyContent:"space-between"}},
          e("div",null,e("div",{style:{fontSize:11,color:"#665A40"}},"จากงานจริง"),e("div",{style:{fontWeight:700,color:"#C8A35A"}},fmt(myEarned))),
          e("div",null,e("div",{style:{fontSize:11,color:"#665A40"}},"การันตีเพิ่ม"),e("div",{style:{fontWeight:700,color:"#BF77F6"}},"+"+fmt(myGuarTotal))),
          e("div",null,e("div",{style:{fontSize:11,color:"#665A40"}},"รวมทั้งหมด"),e("div",{style:{fontWeight:700,color:"#C8A35A"}},fmt(myTotal)))
        )
      ),
      e("div",{style:S.statRow},
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"รอบ 1–15"),e("div",{style:{fontSize:15,fontWeight:700,color:"#C8A35A"}},fmt(periodTotal(1)))),
        e("div",{style:S.statCard},e("div",{style:{fontSize:11,color:"#665A40"}},"รอบ 16–31"),e("div",{style:{fontSize:15,fontWeight:700,color:"#C8A35A"}},fmt(periodTotal(2))))
      ),
      projection&&e("div",{style:{...S.card,textAlign:"center",marginBottom:12}},
        e("div",{style:{fontSize:11,color:"#665A40",marginBottom:4}},"📈 ประมาณการทั้งเดือน"),
        e("div",{style:{fontSize:22,fontWeight:700,color:"#C8A35A"}},fmt(projection))
      ),
      topServices.length>0&&e("div",{style:{...S.card,marginBottom:12}},
        e("div",{style:{fontSize:12,color:"#665A40",marginBottom:8}},"🏅 บริการยอดนิยม"),
        ...topServices.map(([svc,amt],i)=>e("div",{key:i,style:S.svc},e("span",{style:{color:"#B8A888",fontSize:12,flex:1,marginRight:8}},svc),e("span",{style:{color:"#C8A35A",fontWeight:600}},fmt(amt))))
      ),
      chBreakdown.length>0&&e("div",{style:S.card},
        e("div",{style:{fontSize:12,color:"#665A40",marginBottom:8}},"📊 ช่องทาง"),
        ...chBreakdown.map(([ch,amt])=>e("div",{key:ch,style:S.svc},e("span",{style:{...S.badge(ch_color(ch)),fontSize:11}},ch),e("span",{style:{color:"#C8A35A",fontWeight:600}},fmt(amt))))
      )
    ),

    // ── ALL TXN TAB ──
    therapist&&tab==="all"&&e("div",{style:{padding:"12px"}},
      e("div",{style:{display:"flex",gap:6,marginBottom:12,overflowX:"auto"}},
        e("button",{style:S.mBtn(chFilter==="all"),onClick:()=>setChFilter("all")},"ทั้งหมด"),
        ...allChannels.map(ch=>e("button",{key:ch,style:S.mBtn(chFilter===ch),onClick:()=>setChFilter(ch)},ch))
      ),
      guarInfo&&e("div",{style:{marginBottom:12}},e("button",{style:S.mBtn(showGuar),onClick:()=>setShowGuar(!showGuar)},"🛡 การันตี")),
      e("div",{style:{fontSize:12,color:"#665A40",marginBottom:8}},allTxn.length+" รายการ · รวม "+fmt(allTxn.reduce((s,r)=>s+r.payout,0))),
      ...allTxn.map((r,i)=>e("div",{key:i},
        (i===0||allTxn[i-1].date!==r.date)&&e("div",{style:{fontSize:12,color:"#665A40",marginBottom:4,marginTop:i>0?12:0}},th_date(r.date)),
        e(TxnCard,{r})
      )),
      allTxn.length===0&&e("div",{style:{textAlign:"center",color:"#443A28",padding:40}},"ไม่มีรายการ")
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
